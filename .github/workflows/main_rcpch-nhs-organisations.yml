# Builds the production image on a merged live PR, publishes it to GHCR,
# then updates the existing Azure Container App to the immutable image tag.

name: Build and deploy Python app to Azure Container Apps

on:
  push:
    branches:
      - python-bump-deploy-ghcr

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Azure Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/${{ github.repository }}
          tags: |
            type=raw,value=live
            type=raw,value=${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile.production
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-container-app:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Azure Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Deploy immutable image to Azure Container App
        run: >
          az containerapp update
          --name rcpch-nhs-organisations
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}
          --image ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/${{ github.repository }}:${{ github.sha }}

  deploy-mkdocs:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python version
        uses: actions/setup-python@0f07f7f756721ebd886c2462646a35f78a8bc4de
        with:
          python-version: "3.12"

      - name: Install MkDocs and dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocs-git-committers-plugin-2 mkdocs-git-revision-date-localized-plugin mkdocs-macros-plugin mkdocs-with-pdf

      - name: Build MkDocs site
        env:
          SITE_DIR: documentation/site
          DOCS_URL: https://rcpch.github.io/rcpch-nhs-organisations/
        run: mkdocs build --config-file documentation/mkdocs.yml --verbose || exit 1

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: documentation/site
