# Builds the production image on a merged live PR, publishes it to GHCR,
# then updates the existing Azure Container App to the immutable image tag.

name: Build and deploy Python app to Azure Container Apps

on:
  pull_request:
    branches:
      - live
    types:
      - closed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f286b52c9db6e4f62e30e10b079f071f0a3e22e7

      - name: Log in to GHCR
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996eb0a0c
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@6e28d321e2ed7da7c57b91f522975e5f4b0b66f7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=live
            type=raw,value=sha-${{ github.event.pull_request.merge_commit_sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@23dc5e5b86cf44b3439439e0a62a77c72851f9ee
        if: github.event.pull_request.merged == true && !contains(github.event.pull_request.title, '[docs]')
        with:
          context: .
          file: ./Dockerfile.production
          build-args: |
            GIT_SHA=${{ github.event.pull_request.merge_commit_sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-container-app:
    needs: build-and-push
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.title, '[docs]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Azure Login
        uses: azure/login@8e95d52a92255b53a9297b30f9e84a1970d40c33 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Deploy immutable image to Azure Container App
        run: >
          az containerapp update
          --name rcpch-nhs-organisations
          --resource-group RCPCH-Dev-AuditTools
          --image ghcr.io/rcpch/rcpch-nhs-organisations:sha-${{ github.event.pull_request.merge_commit_sha }}

  deploy-mkdocs:
    needs: build-and-push
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.title, '[docs]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python version
        uses: actions/setup-python@0f07f7f756721ebd886c2462646a35f78a8bc4de
        with:
          python-version: "3.12"

      - name: Install MkDocs and dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocs-git-committers-plugin-2 mkdocs-git-revision-date-localized-plugin mkdocs-macros-plugin mkdocs-with-pdf

      - name: Build MkDocs site
        env:
          SITE_DIR: documentation/site
          DOCS_URL: https://rcpch.github.io/rcpch-nhs-organisations/
        run: mkdocs build --config-file documentation/mkdocs.yml --verbose || exit 1

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: documentation/site

  deploy-mkdocs-only:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.title, '[docs]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python version
        uses: actions/setup-python@0f07f7f756721ebd886c2462646a35f78a8bc4de
        with:
          python-version: "3.12"

      - name: Install MkDocs and dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocs-git-committers-plugin-2 mkdocs-git-revision-date-localized-plugin mkdocs-macros-plugin mkdocs-with-pdf

      - name: Build MkDocs site
        env:
          SITE_DIR: documentation/site
          DOCS_URL: https://rcpch.github.io/rcpch-nhs-organisations/
        run: mkdocs build --config-file documentation/mkdocs.yml --verbose || exit 1

      - name: Verify MkDocs build output
        run: ls -la documentation/site || echo "MkDocs build failed or output directory is missing!"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: documentation/site
