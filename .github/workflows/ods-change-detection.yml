name: ODS change detection

# Runs the ODS change-detection checks on a monthly schedule and opens a
# GitHub issue detailing what would change if the sync were applied. This
# gives the team a human-in-the-loop review step before any automatic write
# touches the temporal layer, and surfaces mergers / updates that ODS has
# published without anyone having to watch the API manually.
#
# The checks must run against the production database, which is only
# reachable from inside the Azure Container Apps environment, so the actual
# work happens in an Azure Container Apps Job (named
# <live-app-name>-ods-check) that uses the same image and runtime secrets as
# the live app. This workflow is only the scheduler and the issue creator:
#
#   1. Log in to Azure with the federated OIDF credential (no stored secret).
#   2. Start the Container Apps Job.
#   3. Wait for the execution to finish.
#   4. Fetch the job's console logs and extract the combined report between
#      the <<<ODS_REPORT_START>>> / <<<ODS_REPORT_END>>> markers.
#   5. Open a GitHub issue if the report is non-empty.
#
# The job runs `python manage.py ods_change_report`, which runs the three
# dry-run checks (ODS sync, trust successions, ICB successions) and prints
# the combined report between the markers.
#
# Prerequisites and one-off job setup are documented in
# documentation/docs/developer/ods-change-detection.md. In particular, the
# Container Apps environment must have console logging (Log Analytics)
# enabled — `az containerapp job logs show` reads from it.

on:
  schedule:
    # 07:00 UTC on the 1st of every month
    - cron: "0 7 1 * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  AZURE_JOB_NAME: ${{ secrets.AZURE_LIVE_APP_NAME }}-ods-check
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Get date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start ODS change detection job
        id: start
        run: |
          set -eu
          EXECUTION_NAME=$(az containerapp job start \
            --name "$AZURE_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query name -o tsv || true)
          if [ -z "$EXECUTION_NAME" ]; then
            # Fall back to the newest registered execution (list order is
            # not guaranteed, so sort by start time).
            sleep 15
            EXECUTION_NAME=$(az containerapp job execution list \
              --name "$AZURE_JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "sort_by(@, &startTime)[-1].name" -o tsv)
          fi
          if [ -z "$EXECUTION_NAME" ]; then
            echo "::error::Could not determine the job execution name. Does the job '$AZURE_JOB_NAME' exist in resource group '$AZURE_RESOURCE_GROUP'?"
            exit 1
          fi
          echo "execution-name=$EXECUTION_NAME" >> "$GITHUB_OUTPUT"

      - name: Wait for job execution to finish
        id: execution
        run: |
          set -eu
          EXECUTION_NAME="${{ steps.start.outputs.execution-name }}"
          # The job replica timeout is 30 minutes; poll a little past that.
          STATUS="Unknown"
          for _ in $(seq 1 70); do
            STATUS=$(az containerapp job execution show \
              --name "$AZURE_JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --job-execution-name "$EXECUTION_NAME" \
              --query status -o tsv)
            echo "Execution $EXECUTION_NAME status: $STATUS"
            case "$STATUS" in
              Succeeded|Failed) break ;;
            esac
            sleep 30
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "Succeeded" ]; then
            echo "::error::ODS change detection job finished with status $STATUS"
            exit 1
          fi

      - name: Fetch job logs and extract report
        if: success()
        id: report
        run: |
          set -eu
          az containerapp job logs show \
            --name "$AZURE_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --job-execution-name "${{ steps.start.outputs.execution-name }}" \
            > job_logs.txt
          # Keep only the lines between the sentinel markers, then strip the
          # markers themselves (they may share a line with report content if
          # the log pipeline collapses lines).
          sed -n '/<<<ODS_REPORT_START>>>/,/<<<ODS_REPORT_END>>>/p' job_logs.txt \
            | sed -e 's/.*<<<ODS_REPORT_START>>>//' -e 's/<<<ODS_REPORT_END>>>.*//' \
            > ods_report.md
          if [ -s ods_report.md ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue if changes detected
        if: steps.report.outputs.has_changes == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "ODS changes detected (${{ steps.date.outputs.date }})"
          content-filepath: ods_report.md
          labels: |
            ods-changes
            needs-review

      - name: Prepare failure issue body
        if: failure()
        run: |
          cat > failure.md <<EOF
          The monthly ODS change-detection run failed.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The Container Apps job execution either failed or the workflow could
          not reach it. Check the job logs in the Azure portal (Container Apps
          environment → Jobs → $AZURE_JOB_NAME → Executions) and re-run the
          workflow from the Actions tab once resolved.
          EOF

      - name: Open issue if the check failed
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "ODS change detection failed (${{ steps.date.outputs.date }})"
          content-filepath: failure.md
          labels: |
            ods-changes
            check-failure