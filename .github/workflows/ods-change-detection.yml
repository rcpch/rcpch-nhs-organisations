name: ODS change detection

# Runs the ODS change-detection checks on a monthly schedule and opens a
# GitHub issue detailing what would change if the sync were applied. This
# gives the team a human-in-the-loop review step before any automatic write
# touches the temporal layer, and surfaces mergers / updates that ODS has
# published without anyone having to watch the API manually.
#
# The checks must run against the production database, which is only
# reachable from inside the Azure Container Apps environment, so the actual
# work happens in an Azure Container Apps Job (named
# <live-app-name>-ods-check) that uses the same image and runtime secrets as
# the live app. This workflow is only the scheduler and the issue creator:
#
#   1. Log in to Azure with the federated OIDF credential (no stored secret).
#   2. Start the Container Apps Job.
#   3. Wait for the execution to finish.
#   4. Download the combined report from Azure Blob Storage (the job
#      uploads it there with its managed identity).
#   5. Open a GitHub issue if the report is non-empty.
#
# The job runs `python manage.py ods_change_report`, which runs the three
# dry-run checks (ODS sync, trust successions, ICB successions) and prints
# the combined report between the markers.
#
# Prerequisites and one-off job setup are documented in
# documentation/docs/developer/ods-change-detection.md. In particular, the
# GitHub OIDC identity needs the Storage Blob Data Reader role on the report
# storage account, and ODS_REPORT_STORAGE_ACCOUNT_NAME must be set as a repo
# variable.

on:
  schedule:
    # 07:00 UTC on the 1st of every month
    - cron: "0 7 1 * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  AZURE_JOB_NAME: ods-change-detection
  AZURE_JOB_RESOURCE_GROUP: RCPCH-Dev-AuditTools
  ODS_REPORT_STORAGE_ACCOUNT_NAME: ${{ vars.ODS_REPORT_STORAGE_ACCOUNT_NAME }}
  ODS_REPORT_CONTAINER_NAME: ods-change-reports
  ODS_REPORT_BLOB_NAME: ods-change-report.md

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Get date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start ODS change detection job
        id: start
        run: |
          set -eu
          # `az containerapp job start` returns the execution resource as
          # JSON. The `name` field is the execution name (a GUID). Don't
          # swallow errors with `|| true` — if the start fails we want to
          # fail loudly, not fall back to a stale execution from the list.
          EXECUTION_NAME=$(az containerapp job start \
            --name "$AZURE_JOB_NAME" \
            --resource-group "$AZURE_JOB_RESOURCE_GROUP" \
            --query name -o tsv)
          if [ -z "$EXECUTION_NAME" ]; then
            echo "::error::az containerapp job start returned an empty execution name. The job may not exist or the identity may lack the Container Apps Jobs Contributor role."
            exit 1
          fi
          echo "Started execution: $EXECUTION_NAME"
          echo "execution-name=$EXECUTION_NAME" >> "$GITHUB_OUTPUT"

      - name: Wait for job execution to finish
        id: execution
        timeout-minutes: 40
        run: |
          set -eu
          EXECUTION_NAME="${{ steps.start.outputs.execution-name }}"
          # The job replica timeout is 30 minutes; poll a little past that.
          #
          # Invert the break logic: only the in-progress states (Running,
          # Pending) keep polling. Anything else — Succeeded, Failed,
          # Canceled, TimedOut, an empty string, or a value Azure invents in
          # the future — breaks the loop. Enumerating terminal states is
          # fragile (ProcessExited is a container termination reason, not an
          # execution status, so it never appears here) and caused the runner
          # to poll forever when the status didn't match the list.
          STATUS="Unknown"
          for i in $(seq 1 70); do
            RAW=$(az containerapp job execution show \
              --name "$AZURE_JOB_NAME" \
              --resource-group "$AZURE_JOB_RESOURCE_GROUP" \
              --job-execution-name "$EXECUTION_NAME" \
              -o json 2>&1) || true
            STATUS=$(echo "$RAW" | jq -r '.status // empty' 2>/dev/null || echo "")
            echo "Execution $EXECUTION_NAME status: '${STATUS}' (poll $i/70)"
            # On the first poll, or if the status is empty, dump the full
            # JSON so we can see exactly what Azure is returning.
            if [ "$i" -eq 1 ] || [ -z "$STATUS" ]; then
              echo "--- Full execution JSON ---"
              echo "$RAW" | jq . 2>/dev/null || echo "$RAW"
              echo "--- end JSON ---"
            fi
            case "$STATUS" in
              Running|Pending) sleep 30 ;;
              *) break ;;
            esac
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "execution-name=$EXECUTION_NAME" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "Succeeded" ]; then
            echo "::error::ODS change detection job '$AZURE_JOB_NAME' execution '$EXECUTION_NAME' finished with status '${STATUS}'. See the job's console logs in the Azure portal (Container Apps environment -> Jobs -> $AZURE_JOB_NAME -> Executions -> $EXECUTION_NAME) or via Log Analytics."
            exit 1
          fi

      - name: Download report from blob storage
        if: success()
        id: report
        run: |
          set -eu
          az storage blob download \
            --account-name "$ODS_REPORT_STORAGE_ACCOUNT_NAME" \
            --container-name "$ODS_REPORT_CONTAINER_NAME" \
            --name "$ODS_REPORT_BLOB_NAME" \
            --file ods_report.md \
            --auth-mode login \
            --overwrite
          if [ -s ods_report.md ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue if changes detected
        if: steps.report.outputs.has_changes == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "ODS changes detected (${{ steps.date.outputs.date }})"
          content-filepath: ods_report.md
          labels: |
            ods-changes
            needs-review

      - name: Prepare failure issue body
        if: failure()
        run: |
          EXECUTION_NAME="${{ steps.execution.outputs.execution-name }}"
          STATUS="${{ steps.execution.outputs.status }}"
          cat > failure.md <<EOF
          The monthly ODS change-detection run failed.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The Container Apps job execution either failed or the workflow could
          not reach it.

          - Job: $AZURE_JOB_NAME (resource group $AZURE_JOB_RESOURCE_GROUP)
          - Execution: ${EXECUTION_NAME:-unknown}
          - Final status: ${STATUS:-unknown}

          To see why the job failed, open the job's console logs in the Azure
          portal (Container Apps environment -> Jobs -> $AZURE_JOB_NAME ->
          Executions -> ${EXECUTION_NAME}) or query Log Analytics (see
          documentation/docs/developer/ods-change-detection.md). The job
          prints the failing check and its error in a `Check failures`
          section between the `<<<ODS_REPORT_START>>>` / `<<<ODS_REPORT_END>>>`
          markers on stdout.

          Re-run the workflow from the Actions tab once resolved.
          EOF

      - name: Open issue if the check failed
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "ODS change detection failed (${{ steps.date.outputs.date }})"
          content-filepath: failure.md
          labels: |
            ods-changes
            check-failure